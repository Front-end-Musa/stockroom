services:
  postgres:
    image: postgres:17-alpine
    container_name: product-api-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-products_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - product-api-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-products_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  product-api-data:
